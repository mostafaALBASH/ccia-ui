name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "**.md"
      - "package-lock.json"
      - "src/generated/**"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Project setup
        run: |
          npm run setup
          npm run dev:daemon

      - name: Claude PR review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          direct_prompt: |
            Please review this pull request as a precise, constructive reviewer.
            Focus on:
            - Code correctness and potential bugs
            - Adherence to the patterns described in CLAUDE.md (virtual file system,
              JSX transformer, `@/` aliases, Tailwind, App.jsx entry point)
            - Performance issues
            - Security concerns
            - Test coverage for new logic
            - Readability and maintainability
            Provide specific, actionable feedback. If the change looks good, say so.
            The project is already set up with all dependencies installed, and the dev
            server is running at http://localhost:3000 (logs in logs.txt). You can query
            the SQLite database with the sqlite3 CLI if needed.
          allowed_tools: "Bash(npm:*),Bash(sqlite3:*)"
