name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "package-lock.json"
      - "src/generated/**"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Project Setup
        run: |
          npm run setup

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a precise, constructive reviewer.
            Focus on:
            - Correctness and likely bugs
            - Adherence to the patterns in CLAUDE.md (virtual file system, JSX
              transformer, `@/` aliases, Tailwind, /App.jsx entry point)
            - Performance
            - Security
            - Test coverage for new logic
            - Readability and maintainability
            Provide specific, actionable inline comments where you can, and a
            short summary comment. If the change looks good, say so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm:*),Bash(npx prisma:*),Bash(sqlite3:*)"
